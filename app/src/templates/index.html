<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus // Port Scanner</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --neon-green: #00ff41;
            --dark-green: #008f11;
            --alert-red: #ff003c;
            --panel-bg: #111116;
        }

        body {
            background-color: var(--bg-color);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-shadow: 0 0 10px var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--dark-green);
            padding: 2rem;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1);
        }

        .form-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        input, select, button {
            background: transparent;
            border: 1px solid var(--dark-green);
            color: var(--neon-green);
            padding: 10px 15px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        input {
            flex: 1;
        }

        input:focus, select:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 8px var(--dark-green);
        }

        button {
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--neon-green);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Loading Animation */
        .scanner-loader {
            display: none;
            width: 100%;
            height: 4px;
            background: var(--dark-green);
            position: relative;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .scanner-loader::after {
            content: '';
            position: absolute;
            width: 20%;
            height: 100%;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            animation: scan 1.5s infinite linear;
        }

        @keyframes scan {
            0% { left: -20%; }
            100% { left: 100%; }
        }

        /* Results section */
        #results-container {
            display: none;
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .badge {
            border: 1px solid var(--neon-green);
            padding: 5px 10px;
            background: rgba(0, 255, 65, 0.1);
        }

        .badge.vuln {
            border-color: var(--alert-red);
            color: var(--alert-red);
            background: rgba(255, 0, 60, 0.1);
        }

        .terminal {
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.4;
            position: relative;
        }
    </style>
</head>
<body>

    <h1>Nexus // Scanner</h1>

    <div class="container">
        <form id="scan-form" class="form-group">
            <input type="text" id="target" placeholder="IP ou Domaine (ex: 192.168.1.1)" required>
            <select id="scan-type">
                <option value="quick">Fast Scan (-F)</option>
                <option value="full">Full Scan (-p-)</option>
                <option value="vuln">Vuln Scan (--script vuln)</option>
            </select>
            <button type="submit" id="btn-scan">Initier Scan</button>
        </form>

        <div id="loader" class="scanner-loader"></div>
        <div id="status-text" style="margin-bottom: 1rem; font-style: italic;"></div>

        <div id="results-container">
            <h3>>> ANALYSE_RÉSULTATS</h3>
            <div id="summary" class="summary"></div>
            
            <h3>>> RAW_OUTPUT</h3>
            <div class="terminal" id="raw-output"></div>
        </div>
    </div>

    <script>
        document.getElementById('scan-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const target = document.getElementById('target').value;
            const scanType = document.getElementById('scan-type').value;
            const loader = document.getElementById('loader');
            const statusText = document.getElementById('status-text');
            const resultsContainer = document.getElementById('results-container');
            const btnScan = document.getElementById('btn-scan');

            // Reset UI
            loader.style.display = 'block';
            resultsContainer.style.display = 'none';
            document.getElementById('summary').innerHTML = '';
            document.getElementById('raw-output').textContent = '';
            btnScan.disabled = true;
            btnScan.style.opacity = '0.5';
            statusText.textContent = `[+] Scanning ${target} en cours... Veuillez patienter.`;

            try {
                // Appel à l'API Flask
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target, scan_type: scanType })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erreur serveur inconnue');
                }

                // Affichage du texte brut
                document.getElementById('raw-output').textContent = data.result;
                
                // Parsing intelligent via JS
                parseResults(data.result, scanType);
                
                resultsContainer.style.display = 'block';
                statusText.textContent = `[+] Scan terminé avec succès.`;
            } catch (error) {
                statusText.textContent = `[!] ERREUR: ${error.message}`;
                statusText.style.color = 'var(--alert-red)';
            } finally {
                loader.style.display = 'none';
                btnScan.disabled = false;
                btnScan.style.opacity = '1';
            }
        });

        function parseResults(rawText, scanType) {
            const summaryDiv = document.getElementById('summary');
            let hasFindings = false;

            // 1. Parsing des Ports Ouverts
            // Cherche les lignes du type "80/tcp open http"
            const portRegex = /^(\d+\/[a-zA-Z]+)\s+open\s+(.*)$/gm;
            let match;
            while ((match = portRegex.exec(rawText)) !== null) {
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.textContent = `Port Ouvert: ${match[1]} (${match[2].trim()})`;
                summaryDiv.appendChild(badge);
                hasFindings = true;
            }

            // 2. Parsing des Vulnérabilités (si scan vuln)
            if (scanType === 'vuln') {
                // Cherche les marqueurs de vulnérabilités Nmap
                const vulnLines = rawText.split('\n').filter(line => 
                    line.includes('VULNERABLE') || line.includes('CVE-') || line.includes('State: VULNERABLE')
                );
                
                vulnLines.forEach(vuln => {
                    const badge = document.createElement('div');
                    badge.className = 'badge vuln';
                    badge.textContent = `🚨 VULN: ${vuln.replace('|', '').trim()}`;
                    summaryDiv.appendChild(badge);
                    hasFindings = true;
                });
            }

            if (!hasFindings) {
                summaryDiv.innerHTML = '<span style="color: gray;">Aucun port ouvert ou vulnérabilité critique détecté.</span>';
            }
        }
    </script>
</body>
</html>
